name: docs check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure no-docs-needed label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/labels/no-docs-needed")
          if [ "$status" = "404" ]; then
            curl -sf -X POST \
              -H "Authorization: bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/labels" \
              -d '{"name":"no-docs-needed","color":"0E8A16","description":"Design or behaviour change with no docs/ update required"}'
            echo "Created no-docs-needed label."
          else
            echo "no-docs-needed label already present (HTTP ${status})."
          fi
      - name: Require docs when design or behaviour changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python3 scripts/docs_check_pr.py
