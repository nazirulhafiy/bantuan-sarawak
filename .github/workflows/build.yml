name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # PRs: one group per PR so concurrent PR builds do not cancel each other.
  # main: shared "pages" group without cancel-in-progress so deploys are never cut off mid-flight.
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shared kit sync
        run: |
          set -euo pipefail
          PIN=$(tr -d '[:space:]' < kit/PIN)
          git clone --filter=blob:none --no-checkout https://github.com/nazirulhafiy/sarawak-news-hub.git .hub-kit-check
          git -C .hub-kit-check fetch --depth=1 origin "$PIN"
          git -C .hub-kit-check checkout --detach "$PIN"
          python3 kit/sync.py --check --hub-path "$PWD/.hub-kit-check"
      - name: Check generated docs
        run: python3 kit/generate_docs.py --check
      - name: Validate published scheme sources
        run: python scripts/validate.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build static site
        run: python scripts/build.py
      - name: Check analytics dist against registry
        run: python scripts/check_analytics_dist.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
